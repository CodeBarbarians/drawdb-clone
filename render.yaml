databases:
  - name: drawdb-clone-db
    plan: free
    databaseName: drawdb_clone
    user: drawdb_clone

services:
  - type: web
    name: drawdb-clone-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drawdb-clone-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://drawdb-clone-frontend.onrender.com
      - key: BACKEND_BASE_URL
        value: https://drawdb-clone-backend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://drawdb-clone-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: web
    runtime: static
    name: drawdb-clone-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://drawdb-clone-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
